<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — St Oran's Peer Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-slot"></aside>
  <main class="main">
    <div class="topbar" id="topbar-slot" style="position:relative;"></div>

    <div class="page-title">
      <div>
        <h1>Calendar</h1>
        <div class="subtitle">Plan your assessments, sessions and reminders</div>
      </div>
      <button class="btn btn-primary" id="add-event-btn">+ Add event</button>
    </div>

    <div class="card">
      <div class="cal-header">
        <button class="btn btn-outline btn-sm" id="cal-prev">← Prev</button>
        <h2 id="cal-month-label" style="margin:0;"></h2>
        <button class="btn btn-outline btn-sm" id="cal-next">Next →</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="flex-gap" style="margin-top:16px; font-size:.78rem; color:var(--ink-soft);">
        <span class="flex-gap"><span class="badge-priority priority-high"></span>High importance</span>
        <span class="flex-gap"><span class="badge-priority priority-medium"></span>Medium</span>
        <span class="flex-gap"><span class="badge-priority priority-low"></span>Low</span>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr; margin-top:20px;">
      <div class="card">
        <div class="card-header"><h3>All upcoming events</h3></div>
        <div id="event-list"></div>
      </div>
    </div>
  </main>
</div>

<div id="roro-slot"></div>

<div class="modal-overlay hidden" id="event-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add an event</h3>
      <button class="modal-close" id="event-modal-close">&times;</button>
    </div>
    <form id="event-form">
      <div class="field">
        <label for="ev-title">Event title</label>
        <input id="ev-title" type="text" placeholder="e.g. Biology test" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ev-date">Date</label>
          <input id="ev-date" type="date" required>
        </div>
        <div class="field">
          <label for="ev-importance">Importance</label>
          <select id="ev-importance">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save event</button>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/calendar.js"></script>
</body>
</html>
