<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Peer — St Oran's Peer Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-slot"></aside>
  <main class="main">
    <div class="topbar" id="topbar-slot" style="position:relative;"></div>

    <div class="page-title">
      <div>
        <h1>Find a Peer</h1>
        <div class="subtitle">Ask a classmate before you ask the internet</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="field-row" style="align-items:end;">
        <div class="field mb-0">
          <label for="fp-search">Search by name or subject</label>
          <input id="fp-search" type="text" placeholder="e.g. Calculus, Priya...">
        </div>
        <div class="field mb-0">
          <label for="fp-year">Year level</label>
          <select id="fp-year">
            <option value="">Any year</option>
            <option>Year 10</option><option>Year 11</option><option>Year 12</option><option>Year 13</option>
          </select>
        </div>
        <div class="field mb-0">
          <label for="fp-avail">Availability</label>
          <select id="fp-avail">
            <option value="">Any time</option>
            <option value="now">Available now</option>
            <option value="soon">Available soon</option>
            <option value="later">Available later</option>
          </select>
        </div>
      </div>
      <div class="tag-list" id="fp-subject-chips" style="margin-top:14px;"></div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(2,1fr);" id="peer-grid"></div>
    <div id="peer-empty" class="empty-state hidden"><div class="glyph">🔍</div>No peers match your search yet — try a different subject.</div>
  </main>
</div>

<div id="roro-slot"></div>

<div class="modal-overlay hidden" id="request-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Send a peer request</h3>
      <button class="modal-close" id="request-modal-close">&times;</button>
    </div>
    <p class="text-muted" id="request-body" style="font-size:.9rem;"></p>
    <div class="field">
      <label for="request-msg">Add a short message (optional)</label>
      <textarea id="request-msg" rows="3" placeholder="Hi! Could you help me with..."></textarea>
    </div>
    <button class="btn btn-primary btn-block" id="request-send">Send request</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/find-peer.js"></script>
</body>
</html>
