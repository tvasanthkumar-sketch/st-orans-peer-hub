<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — St Oran's Peer Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-slot"></aside>
  <main class="main">
    <div class="topbar" id="topbar-slot" style="position:relative;"></div>

    <div class="page-title">
      <div>
        <h1>Settings</h1>
        <div class="subtitle">Manage your account and how the Hub reaches you</div>
      </div>
    </div>

    <div class="grid grid-dashboard">
      <div class="stack">
        <div class="card">
          <div class="card-header"><h3>Account information</h3></div>
          <div class="field">
            <label for="st-username">Username</label>
            <input id="st-username" type="text" disabled>
          </div>
          <div class="field">
            <label for="st-name">Full name</label>
            <input id="st-name" type="text">
          </div>
          <button class="btn btn-primary" id="st-save-account">Save changes</button>
        </div>

        <div class="card">
          <div class="card-header"><h3>Change password</h3></div>
          <div class="field">
            <label for="st-password">New password</label>
            <input id="st-password" type="password" placeholder="Enter a new password">
          </div>
          <button class="btn btn-outline" id="st-save-password">Update password</button>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card-header"><h3>Notifications</h3></div>
          <label class="flex-between" style="padding:9px 0; border-bottom:1px solid var(--border-hair); cursor:pointer;">
            <span style="font-size:.87rem;">Peer request &amp; reminder notifications</span>
            <input type="checkbox" id="st-notifications" style="width:17px;height:17px; accent-color:var(--forest);">
          </label>
          <label class="flex-between" style="padding:9px 0; cursor:pointer;">
            <span style="font-size:.87rem;">Weekly progress digest</span>
            <input type="checkbox" id="st-digest" style="width:17px;height:17px; accent-color:var(--forest);">
          </label>
        </div>

        <div class="card" style="border-color:rgba(122,46,55,0.3);">
          <div class="card-header"><h3 style="color:var(--burgundy);">Session</h3></div>
          <p class="text-muted" style="font-size:.85rem;">Signing out will return you to the login screen. Your data stays saved.</p>
          <button class="btn btn-burgundy btn-block" id="st-signout">Sign out</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="roro-slot"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/settings.js"></script>
</body>
</html>
