<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — St Oran's Peer Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-slot"></aside>
  <main class="main">
    <div class="topbar" id="topbar-slot" style="position:relative;"></div>

    <div class="page-title" style="border-bottom:none; margin-top:22px;">
      <div>
        <h1 id="greeting">Good afternoon,</h1>
        <div class="subtitle" id="thought-of-day"></div>
      </div>
    </div>

    <div class="grid grid-dashboard">
      <div class="stack">

        <div class="card card-gold">
          <div class="card-header">
            <div>
              <span class="eyebrow-label">TODAY</span>
              <h3 class="mt-0">Your Peer Points progress</h3>
            </div>
            <a href="progress.html" class="link">View progress →</a>
          </div>
          <div style="display:flex; align-items:center; gap:22px;">
            <div style="flex:1;">
              <div class="flex-between" style="margin-bottom:8px;">
                <span class="text-muted" style="font-size:.82rem;">Level progress</span>
                <span style="font-weight:700; color:var(--forest-deep);" id="points-label"></span>
              </div>
              <div class="progress-track"><div class="progress-fill" id="points-fill" style="width:0%;"></div></div>
            </div>
            <div style="text-align:center;">
              <div style="font-family:var(--font-display); font-size:1.6rem; color:var(--gold-deep); font-weight:700;" id="streak-num">0</div>
              <div style="font-size:.7rem; color:var(--ink-soft);">day streak</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Upcoming deadlines</h3>
            <a href="assignments.html" class="link">All assignments →</a>
          </div>
          <div id="deadlines-list"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Students who can help right now</h3>
            <a href="find-peer.html" class="link">Find a peer →</a>
          </div>
          <div id="peers-list" style="display:flex; flex-direction:column; gap:16px;"></div>
        </div>

      </div>

      <div class="stack">
        <div class="card">
          <div class="card-header">
            <h3>Find a peer</h3>
          </div>
          <form id="home-peer-search" style="display:flex; gap:8px;">
            <input type="text" placeholder="Search by subject or name" style="flex:1; padding:10px 13px; border:1px solid var(--border-hair); border-radius:8px;">
            <button class="btn btn-gold btn-sm" type="submit">Search</button>
          </form>
          <div class="tag-list" style="margin-top:12px;">
            <span class="chip">Mathematics</span><span class="chip">Chemistry</span><span class="chip">English</span>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>This month</h3>
            <a href="calendar.html" class="link">Full calendar →</a>
          </div>
          <div class="cal-header" style="margin-bottom:10px;">
            <strong id="mini-cal-label" style="font-family:var(--font-display);"></strong>
          </div>
          <div class="cal-grid" id="mini-cal"></div>
        </div>

        <div class="card" style="background:var(--forest); border:none;">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
            <span style="font-size:1.4rem;">🌱</span>
            <h3 style="color:var(--gold-soft); margin:0;">Daily thought</h3>
          </div>
          <p style="color:var(--cream); font-family:var(--font-display); font-style:italic; font-size:1.05rem; margin:0;" id="thought-quote"></p>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="roro-slot"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/home.js"></script>
</body>
</html>
