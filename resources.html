<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Resources — St Oran's Peer Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-slot"></aside>
  <main class="main">
    <div class="topbar" id="topbar-slot" style="position:relative;"></div>

    <div class="page-title">
      <div>
        <h1>Study Resources</h1>
        <div class="subtitle">Notes, guides and recordings shared by your peers</div>
      </div>
      <button class="btn btn-primary" id="add-resource-btn">+ Share a resource</button>
    </div>

    <div class="tag-list" id="resource-subject-filter" style="margin-bottom:22px;"></div>

    <div class="grid" style="grid-template-columns:repeat(3,1fr);" id="resource-grid"></div>
    <div id="resource-empty" class="empty-state hidden"><div class="glyph">📚</div>No resources for this subject yet — be the first to share one.</div>
  </main>
</div>

<div id="roro-slot"></div>

<div class="modal-overlay hidden" id="resource-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Share a resource</h3>
      <button class="modal-close" id="resource-modal-close">&times;</button>
    </div>
    <form id="resource-form">
      <div class="field">
        <label for="res-title">Title</label>
        <input id="res-title" type="text" placeholder="e.g. Cell biology summary" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="res-subject">Subject</label>
          <select id="res-subject"></select>
        </div>
        <div class="field">
          <label for="res-type">Type</label>
          <select id="res-type">
            <option>Notes</option><option>Guide</option><option>Video</option><option>Template</option><option>Audio</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Add resource</button>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/resources.js"></script>
</body>
</html>
